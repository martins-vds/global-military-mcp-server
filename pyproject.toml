[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "global-military-mcp-server"
version = "0.1.0"
description = "MCP server for searching military equipment and inventory data from GlobalMilitary.net"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastmcp<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "inline-snapshot>=0.18",
]

[project.scripts]
global-military = "src.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
